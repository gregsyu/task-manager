[tool.poetry]
name = "task-manager"
version = "0.1.0"
description = ""
authors = ["gregsyu <greg3@tutamail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.128.0,<0.129.0"
sqlalchemy = ">=2.0.46,<3.0.0"
python-jose = {extras = ["cryptography"], version = ">=3.5.0,<4.0.0"}
pydantic-settings = ">=2.12.0,<3.0.0"
pymysql = ">=1.1.2,<2.0.0"
passlib = ">=1.7.4,<2.0.0"
argon2-cffi = ">=25.1.0,<26.0.0"
uvicorn = "^0.30.0"
pydantic = {extras = ["email"], version = "^2.13.4"}
python-multipart = "^0.0.32"
sqlmodel = "^0.0.39"
httpx = "^0.28.1"

[tool.poetry.group.dev.dependencies]
alembic = ">=1.18.2,<2.0.0"
pytest = "^9.1.1"
mypy = "^2.1.0"
flake8 = "^7.3.0"
flake8-pyproject = "^1.2.4"
pre-commit = "^4.6.1"
types-python-jose = "^3.5.0.20260408"
types-passlib = "^1.7.7.20260211"

[tool.flake8]
exclude = "alembic"
max-line-length = 127
max-complexity = 10

[tool.pyright]
deprecateTypingAliases = false
reportMissingTypeStubs = false
reportAny = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
